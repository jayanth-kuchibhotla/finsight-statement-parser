name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install boto3 pdfplumber pikepdf pandas botocore

      - name: Run S3 Trigger tests
        env:
          AWS_DEFAULT_REGION: ap-south-1
        run: python -m unittest discover -s S3-Trigger-Service/Tests/Unit-Tests -p "*.py" --top-level-directory .

      - name: Run Presigned URL tests
        env:
          AWS_DEFAULT_REGION: ap-south-1
        run: python -m unittest discover -s Statement-Service-Presigned-URL-Generation/Tests/Unit-Tests -p "*.py" --top-level-directory .

      - name: Run Statement Parser tests
        env:
          AWS_DEFAULT_REGION: ap-south-1
        run: python -m unittest discover -s Statement-Parser/Tests/Unit-Tests -p "*.py" --top-level-directory .